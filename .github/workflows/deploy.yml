name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# Dos pushes seguidos no deben correr dos `sst deploy` sobre el mismo state.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Única fuente de la región del workflow: la consumen
      # configure-aws-credentials y el smoke de la imagen (que arma con ella el
      # host del registry ECR). Si un cliente despliega en otra región, se cambia
      # acá y en `region` de client.config.ts.
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: docker/setup-qemu-action@v3   # build ARM64 desde runners x86
      # El driver docker default NO buildea plataformas no nativas ni con QEMU:
      # hace falta un builder docker-container. Sin esto, el build ARM64 falla.
      - uses: docker/setup-buildx-action@v3
      # Sin input python-version: no existe en setup-uv@v3, y uv descarga solo
      # el Python que pide requires-python (3.13) al primer `uv run`.
      - uses: astral-sh/setup-uv@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm ci
      # `.sst/platform` es gitignoreado: sin este paso, `sst.config.ts` no
      # resuelve sus globals (`aws`, `awsnative`, `$interpolate`, ...) y el
      # typecheck de infra de abajo falla por scaffolding faltante, no por un
      # error real.
      #
      # El `--stage` es obligatorio acá: `.sst/stage` también es gitignoreado, y
      # sin stage `sst install` corta al terminar de bajar pulumi y bun.
      - run: npx sst install --stage staging --print-logs
        env:
          SST_STAGE: staging
      - run: npm run typecheck && npm test
      # Typecheck de sst.config.ts + infra/ (el de workspaces no los cubre).
      # Filtra el único error preexistente de .sst/platform (vendored, gitignoreado).
      - run: npm run typecheck:infra
      # El core (Python/ARM64) tiene su propia suite, corre acá antes de construir
      # la imagen que empaqueta el Runtime: si esto falla, no tiene sentido desplegar.
      - run: uv run pytest core/tests/ -v
      # Un solo ambiente desplegado: este repo es el TEMPLATE, y lo único que
      # necesita en vivo es el showcase con el que se demuestra y se prueba.
      # El stage se llama `staging` y se deja fijo: el nombre está incrustado en
      # el nombre físico de cada recurso (el repo ECR, las URLs), renombrarlo
      # obliga a recrear el stack entero y nadie lo ve desde afuera. Un clon de
      # cliente elige los stages que quiera.
      - run: npx sst deploy --stage staging
      # Ground truth del contenedor (diagnóstico): correr la imagen recién
      # pusheada en el runner (QEMU) y exigir /ping. Si esto pasa y AgentCore
      # igual falla su health check, el problema es de la plataforma, no de la
      # imagen. FAKE_LLM evita credenciales de Bedrock.
      - name: smoke de la imagen
        run: |
          set -euo pipefail
          # Nada de identificadores fijos acá: en el repo de un cliente esto tiene
          # que resolver a SU cuenta y SU repo. La cuenta sale de STS (las
          # credenciales que ya asumió el job), la región del env del job y el
          # nombre del repo ECR del output `repoCore` del propio deploy — que lo
          # define infra/sst/runtime.ts a partir del slug de client.config.ts.
          cuenta=$(aws sts get-caller-identity --query Account --output text)
          repo=$(jq -re '.repoCore' .sst/outputs.json)
          registry="${cuenta}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMG="${registry}/${repo}:latest"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker pull -q --platform linux/arm64 "$IMG"
          cid=$(docker run -d -p 8080:8080 -e MODEL_ID=fake -e FAKE_LLM=1 "$IMG")
          ok=""
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/ping; then ok=1; break; fi; sleep 2
          done
          echo "--- docker logs ---"
          docker logs "$cid" || true
          [ -n "$ok" ] || { echo "PING FALLÓ tras 120s"; exit 1; }
